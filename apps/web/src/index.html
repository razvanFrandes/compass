<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compass</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Geist+Mono:wght@400;500&family=Archivo:wdth,wght@75..125,400..700&family=Chivo+Mono:wght@400;500&display=swap">
  <script>
    // Theme: the choice the app saved (localStorage "compass-theme"), else an explicit data-theme on <html>,
    // else dark, like Juyo's product. Spartan reads the .dark class; "juyo-concept" is a light theme.
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('compass-theme');
        if (saved === 'light' || saved === 'dark' || saved === 'juyo-concept') root.setAttribute('data-theme', saved);
      } catch (e) {}
      function apply() {
        var theme = root.getAttribute('data-theme');
        var light = theme === 'light' || theme === 'juyo-concept';
        root.classList.toggle('light', light);
        root.classList.toggle('dark', !light);
      }
      apply();
      new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
