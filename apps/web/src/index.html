  <script>
    // Theme: an explicit data-theme on <html> wins, then the choice remembered in this browser (localStorage
    // "compass.theme": light, dark or juyo-concept). With no choice the app is dark, like Juyo's product,
    // whatever the OS prefers. Spartan reads the .dark class; "juyo-concept" is a light theme.
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('compass.theme');
        if (!root.getAttribute('data-theme') && (saved === 'light' || saved === 'dark' || saved === 'juyo-concept')) root.setAttribute('data-theme', saved);
      } catch (e) {}
      function apply() {
        var theme = root.getAttribute('data-theme') || 'dark';
        var light = theme === 'light' || theme === 'juyo-concept';
        root.classList.toggle('light', light);
        root.classList.toggle('dark', !light);
      }
      apply();
      new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
