@let s = view();
@let b = built();
<figure
  class="wc"
  [class.wc-shimmer]="state() === 'skeleton'"
  [attr.aria-labelledby]="header() && state() !== 'skeleton' ? uid + '-t' : null"
  [attr.aria-label]="header() && state() !== 'skeleton' ? null : s.title || 'Chart'"
  [attr.aria-busy]="b ? null : 'true'"
>
  @if (header() || toggleSlot()) {
  <figcaption class="wc-head">
    <div class="wc-titles">
      @if (header()) {
        @if (state() === 'skeleton') {
          <!-- The real words, invisible, with a bar on each line: the header is already the height it will be -->
          <p class="wc-title" aria-hidden="true"><span class="wc-ink" [class.wc-ink--stub]="!s.title"><span>{{ s.title || nbsp }}</span></span></p>
          @if (s.subtitle || !s.title) {
            <p class="wc-subtitle" aria-hidden="true"><span class="wc-ink" [class.wc-ink--stub]="!s.subtitle" style="--wc-stub: 180px"><span>{{ s.subtitle || nbsp }}</span></span></p>
          }
        } @else {
          <p class="wc-title" [id]="uid + '-t'">{{ s.title }}</p>
          @if (subtitle(); as sub) {
            <p class="wc-subtitle">{{ sub }}</p>
          }
        }
      }
    </div>
    @if (header() && switcher()) {
      <div class="wc-head-tools">
        @if (b && options().length > 1) {
          <juyo-view-as [options]="options()" [value]="s.kind" [recommended]="recommendedKind()" [of]="s.title" (picked)="viewAs($event)" />
        } @else if (!b) {
          <span class="wc-view--stub" aria-hidden="true"></span>
        }
      </div>
    }
    @if (toggleSlot()) {
      <button type="button" class="wc-toggle" [attr.title]="asTable() ? 'View as chart' : 'View as table'" [class.wc-toggle--stub]="state() === 'skeleton' || (b && !canToggle())" [disabled]="!canToggle()" [attr.aria-label]="(asTable() ? 'View as chart: ' : 'View as table: ') + s.title" (click)="asTable.set(!asTable())">
        <ng-icon [name]="asTable() ? 'phosphorChartBarLight' : 'phosphorTableLight'" aria-hidden="true" />
      </button>
    }
  </figcaption>
  }

  <div class="wc-body" [style.height.px]="bodyH()">
    @if (!b) {
      <!-- A skeleton of this kind, in the box the finished widget will have -->
      <div class="wc-sk-host" [class.wc-shimmer]="state() !== 'skeleton'" role="status">
        <span class="sr-only">Loading {{ s.title || 'chart' }}…</span>
        <juyo-widget-skeleton [plan]="plan()" [compact]="compact()" [narrow]="narrow()" />
      </div>
    } @else if (b.render === 'empty') {
      <p class="wc-empty">{{ b.message }}</p>
    } @else if (showTable()) {
      <div class="wc-table-wrap" tabindex="0" role="group" [attr.aria-label]="s.title + ' (data table)'">
        <table class="wc-table">
          <caption class="sr-only">
            {{ s.title }}
          </caption>
          <thead>
            <tr>
              @for (col of b.table.columns; track col.key; let i = $index) {
                <th scope="col" [class.wc-num]="col.align === 'right'" [attr.aria-sort]="ariaSort(i)">
                  <button type="button" class="wc-sort" (click)="sortBy(i)">
                    <span>{{ col.label }}</span>
                    <ng-icon [name]="sortIcon(i)" aria-hidden="true" [class.wc-sort-on]="ariaSort(i) !== 'none'" />
                  </button>
                </th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of sortedRows(); track $index) {
              <tr>
                @for (cell of row; track $index; let i = $index) {
                  @if (i === 0) {
                    <th scope="row" [class.wc-num]="b.table.columns[i].align === 'right'">{{ cell.text }}</th>
                  } @else {
                    <td [class.wc-num]="b.table.columns[i].align === 'right'" [class.wc-null]="cell.sort === null">{{ cell.text }}</td>
                  }
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    } @else if (b.render === 'echarts') {
      @if (b.legend.length || b.ramp) {
        <div class="wc-legend-row">
          @if (b.legend.length) {
            <ul class="wc-legend" aria-label="Legend">
              @for (l of b.legend; track l.label) {
                <li><i class="wc-mark" [attr.data-mark]="l.mark" [style.--wc-mark]="l.color" aria-hidden="true"></i>{{ l.label }}</li>
              }
            </ul>
          }
          @if (b.ramp; as r) {
            <p class="wc-ramp">
              <span>{{ r.label }}</span>
              <span class="wc-ramp-end">{{ r.min }}</span>
              <span class="wc-ramp-bar" aria-hidden="true">
                @for (color of r.colors; track $index) {
                  <i [style.background]="color"></i>
                }
              </span>
              <span class="wc-ramp-end">{{ r.max }}</span>
            </p>
          }
        </div>
      }
      <div class="wc-plot" role="img" tabindex="0" [attr.aria-label]="summary()" [attr.aria-describedby]="b.points.length ? uid + '-k' : null" (keydown)="onKey($event)" (blur)="leave()">
        <juyo-echart [option]="b.option" />
      </div>
      @if (b.more) {
        <button type="button" class="wc-more" [attr.aria-label]="'+' + b.more + ' more: show all ' + b.table.rows.length + ' rows as a table'" (click)="showAll()">+{{ b.more }} more</button>
      }
      @if (b.points.length) {
        <span class="sr-only" [id]="uid + '-k'">Use the arrow keys to step through the data. The same numbers are in {{ switcher() ? '“View as”, Table' : '“View as table”' }}.</span>
      }
    } @else if (b.render === 'calendar') {
      @let cal = b.calendar;
      <div class="wc-cal" [style.--wc-cell.px]="cal.cell" [style.--wc-cal-gap.px]="cal.gap">
        <div class="wc-cal-plot" role="img" tabindex="0" [attr.aria-label]="summary()" [attr.aria-describedby]="uid + '-k'" (keydown)="onCalKey($event)" (blur)="leave()" (pointerleave)="calTip.set(null)">
          <div class="wc-cal-months">
            @for (m of cal.months; track m.key) {
              <div class="wc-cal-month">
                <p class="wc-cal-name">{{ m.name }}</p>
                <div class="wc-cal-grid">
                  @for (w of cal.weekdays; track $index) {
                    <span class="wc-cal-wd">{{ cal.cell < 44 ? w.slice(0, 1) : w }}</span>
                  }
                  @for (week of m.weeks; track $index) {
                    @for (d of week; track $index) {
                      @if (d) {
                        <span
                          class="wc-cal-day"
                          [class.wc-cal-day--off]="!d.inRange"
                          [class.wc-cal-day--today]="d.today"
                          [class.wc-cal-day--on]="d.inRange && d.index === cursor()"
                          [attr.data-i]="d.inRange ? d.index : null"
                          [style.background]="d.inRange ? d.fill : null"
                          [style.color]="d.inRange ? d.ink : null"
                          (pointerenter)="d.inRange ? pointAt(d.index, $any($event.currentTarget)) : calTip.set(null)"
                          ><span class="wc-cal-num">{{ d.day }}</span>
                          @if (d.inRange && cal.cell >= 40) {
                            <span class="wc-cal-val">{{ d.text }}</span>
                          }
                        </span>
                      } @else {
                        <span class="wc-cal-pad"></span>
                      }
                    }
                  }
                </div>
              </div>
            }
          </div>
          @if (calTip(); as tp) {
            @let d = cal.days[tp.i];
            <div class="wc-cal-tip" [class.wc-cal-tip--below]="tp.below" [style.left.px]="tp.x" [style.top.px]="tp.y">
              <p class="wc-cal-tip-date">{{ tp.date }}</p>
              <p class="wc-cal-tip-value"><i [style.background]="d.fill"></i>{{ d.full }}</p>
              @if (d.meaning) {
                <p class="wc-cal-tip-meaning">{{ d.meaning }}</p>
              }
            </div>
          }
        </div>
        <div class="wc-cal-scale">
          <span class="wc-cal-word">{{ cal.scale.lowLabel }}</span>
          <span class="wc-cal-bar-wrap">
            <span class="wc-cal-bar" [style.background]="cal.scale.gradient"></span>
            <span class="wc-cal-tick wc-cal-tick--min">{{ cal.scale.minText }}</span>
            @if (cal.scale.midText) {
              <span class="wc-cal-tick wc-cal-tick--mid" [style.left.%]="(cal.scale.midAt ?? 0.5) * 100">{{ cal.scale.midText }}</span>
            }
            <span class="wc-cal-tick wc-cal-tick--max">{{ cal.scale.maxText }}</span>
          </span>
          <span class="wc-cal-word">{{ cal.scale.highLabel }}</span>
        </div>
      </div>
      <span class="sr-only" [id]="uid + '-k'">Use the arrow keys to step through the nights. The same numbers are in {{ switcher() ? '“View as”, Table' : '“View as table”' }}.</span>
    } @else if (b.render === 'kpi') {
      <div class="wc-kpi">
        <div class="wc-kpi-text">
          <p class="wc-kpi-label">{{ b.kpi.label }}</p>
          <p class="wc-kpi-value">{{ b.kpi.value }}</p>
          @if (b.kpi.delta; as d) {
            <p class="wc-delta-line">
              <span class="wc-delta" [attr.data-tone]="d.tone"><span aria-hidden="true">{{ d.text }}</span><span class="sr-only">{{ d.spoken }}</span></span>
              <span>{{ b.kpi.versus }}</span>
            </p>
          }
        </div>
        @if (b.kpi.spark; as sp) {
          <div class="wc-spark wc-spark--kpi" aria-hidden="true">
            <svg viewBox="0 0 100 28" preserveAspectRatio="none">
              <path class="wc-spark-area" [attr.d]="sp.area" />
              <path class="wc-spark-line" [attr.d]="sp.line" />
            </svg>
            <i class="wc-spark-dot" [style.top.%]="sp.lastY * 100"></i>
          </div>
        }
      </div>
    } @else if (b.render === 'kpi_row') {
      <ul class="wc-tiles" [style.--wc-tiles]="tileCols()">
        @for (k of b.tiles; track k.label) {
          <li class="wc-tile">
            <p class="wc-kpi-label">{{ k.label }}</p>
            <p class="wc-tile-value">{{ k.value }}</p>
            <div class="wc-tile-foot">
              @if (k.delta; as d) {
                <p class="wc-delta-line">
                  <span class="wc-delta" [attr.data-tone]="d.tone"><span aria-hidden="true">{{ d.text }}</span><span class="sr-only">{{ d.spoken }}</span></span>
                  <span class="wc-versus">{{ k.versus }}</span>
                </p>
              }
              @if (k.spark; as sp) {
                <div class="wc-spark wc-spark--tile" aria-hidden="true">
                  <svg viewBox="0 0 100 28" preserveAspectRatio="none">
                    <path class="wc-spark-area" [attr.d]="sp.area" />
                    <path class="wc-spark-line" [attr.d]="sp.line" />
                  </svg>
                  <i class="wc-spark-dot" [style.top.%]="sp.lastY * 100"></i>
                </div>
              }
            </div>
          </li>
        }
      </ul>
    } @else if (b.render === 'sparklines') {
      <ul class="wc-sparks" tabindex="0" [attr.aria-label]="s.title + ' (trends)'">
        @for (it of b.items; track it.label) {
          <li class="wc-spark-row">
            <span class="wc-spark-name">{{ it.label }}</span>
            <span class="wc-spark" aria-hidden="true">
              @if (it.spark; as sp) {
                <svg viewBox="0 0 100 28" preserveAspectRatio="none">
                  <path class="wc-spark-line" [attr.d]="sp.line" />
                </svg>
                <i class="wc-spark-dot" [style.top.%]="sp.lastY * 100"></i>
              }
            </span>
            <span class="wc-spark-value">{{ it.value }}</span>
            <span class="wc-spark-delta">
              @if (it.delta; as d) {
                <span class="wc-delta" [attr.data-tone]="d.tone"><span aria-hidden="true">{{ d.text }}</span><span class="sr-only">{{ d.spoken }}</span></span>
              }
            </span>
          </li>
        }
      </ul>
    }
    @if (b?.note; as note) {
      <p class="wc-note">{{ note }}</p>
    }
  </div>
  @if (switcherSlot()) {
    <div class="wc-view-row" #viewRow [style.min-height.px]="rowFloor() || null">
      @if (b && options().length > 1) {
        <juyo-view-as [options]="options()" [value]="s.kind" [recommended]="recommendedKind()" [of]="s.title" (picked)="viewAs($event)" />
      } @else if (!b) {
        <!-- The row is there before the rows are, so the card does not grow when the chart lands -->
        <span class="wc-view--stub" aria-hidden="true"></span>
      }
    </div>
  }
  <span class="sr-only" aria-live="polite">{{ announce() }}</span>
</figure>
